
<div class="loader-overlay">
  <div class="loader-wrapper">
    <div class="loader-container">

      <!-- Center Logo -->
      <div class="logo-container">
        <img src="/logo.png" alt="Loading..." class="loader-image" />
      </div>

      <!-- Rotating Dots -->
      <div class="dots-container">
  @for (dot of dots; let i = $index; track $index) {
    <div
      class="dot-wrapper"
      [style.transform]="'rotate(' + getRotation(i) + 'deg) translate(0, -60px)'"
    >
      <div
        class="dot"
        [class.active]="isActive(i)"
        [class.previous]="isPrevious(i)"
      ></div>
    </div>
  }
</div>


      <!-- Outer Ring -->
      <!-- <div class="outer-ring"></div> -->

    </div>

    <!-- Loading Text -->
    <!-- <div class="loading-text">
      <p>Loading...</p>
    </div> -->
  </div>
</div>
