<div
  [routerLink]="link || null"
  [class.cursor-pointer]="link"
  [ngClass]="customClass"
  class="bg-white p-4 sm:p-6 rounded-2xl border border-gray-100 shadow-sm
         hover:shadow-xl transition-all group relative w-full">

  <div class="relative flex flex-col gap-3 sm:gap-4">

    <!-- Icon Box -->
    <div
      class="w-12 h-12 sm:w-14 sm:h-14 rounded-xl flex items-center justify-center text-white shadow-md
             group-hover:scale-105 transition-transform duration-300"
      [ngStyle]="{ background: iconBg }">

      <ng-icon
        [name]="icon"
        class="text-white"
        style="width: 18px; height: 18px;"
      ></ng-icon>

    </div>

    <div>

      <!-- Title -->
      @if (title) {
        <h3 class="font-semibold text-base sm:text-lg text-gray-900 leading-snug">
          {{ title }}
        </h3>
      }

      <!-- Count (stats style) -->
      @if (count) {
        <h2 class="text-xl sm:text-2xl font-bold text-gray-900 tracking-tight mt-1">
          {{ count }}
        </h2>
      }

      <!-- Description -->
      @if (description) {
        <p class="text-gray-600 text-sm sm:text-[15px] mt-2 leading-relaxed">
          {{ description }}
        </p>
      }

      <!-- Label (stats label) -->
      @if (label) {
        <p class="text-gray-600 text-sm sm:text-[15px] mt-2 leading-relaxed">
          {{ label }}
        </p>
      }

    </div>

  </div>

</div>
