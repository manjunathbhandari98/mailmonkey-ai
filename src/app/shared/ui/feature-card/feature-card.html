<div
  [routerLink]="link || null"
  [class.cursor-pointer]="link"
  [ngClass]="customClass"
  class="bg-white p-6 rounded-2xl border border-gray-100 shadow-sm
         hover:shadow-xl transition-all group relative">

  <div class="relative flex flex-col gap-4">

    <!-- Icon Box (solid or gradient) -->
    <div
      class="w-14 h-14 rounded-xl flex items-center justify-center text-white shadow-md
             group-hover:scale-105 transition-transform duration-300"
      [ngStyle]="{ background: iconBg }">

      <ng-icon
        [name]="icon"
        style="width: 20px; height: 20px;"
        >
      </ng-icon>

    </div>

    <div>
      <!-- Feature Card Title -->
      @if (title) {
        <h3 class="font-bold text-lg text-gray-900">{{ title }}</h3>
      }

      <!-- Stats Value -->
      @if (count) {
        <h2 class="text-2xl font-bold text-gray-900 tracking-tight mt-1">
          {{ count }}
        </h2>
      }

      <!-- Feature Card Description -->
      @if (description) {
        <p class="text-gray-600 text-sm mt-2">{{ description }}</p>
      }

      <!-- Stats Label -->
      @if (label) {
        <p class="text-gray-600 text-sm mt-2">{{ label }}</p>
      }
    </div>

  </div>

</div>
