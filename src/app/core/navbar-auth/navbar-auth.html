<div class="flex justify-between items-center p-3 fixed top-0 left-0 w-full z-50 bg-white">
  <!-- Left side (Logo) -->
   <a href="/dashboard">
     <app-logo></app-logo>
   </a>

  <!-- Right Side (Navs) -->
   <div class="flex items-center gap-7">
         <a
      [routerLink]="['/register']"
      routerLinkActive="router-link-active"
      class="bg-blue-600 rounded-lg cursor-pointer px-4 py-2 text-sm font-bold text-white hover:bg-blue-700 transition"
    >
    Generate
    </a>
       <ng-icon
       [name]="'heroBell'"
       style="width: 24px; height: 24px;cursor: pointer;"
       >
       </ng-icon>
         <ng-icon
       [name]="'heroCog6Tooth'"
       [routerLink]="['/settings']"
       style="width: 24px; height: 24px;cursor: pointer;"
       >
    
       </ng-icon>

       <div class="flex gap-2 ml-5 items-center">
        <div class="p-2 w-10 h-10 text-center rounded-full bg-blue-500 text-white uppercase">{{getInitials()}}</div>
        <div class="flex flex-col text-sm">
            <h2 class="font-semibold">{{profileInfo.name}}</h2>
            <p class="text-xs text-gray-800">{{profileInfo.email}}</p>
        </div>
       </div>
   </div>

</div>
