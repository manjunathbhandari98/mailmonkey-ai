<div class="fixed top-0 left-0 w-full bg-white z-50 shadow-sm">
  <div class="max-w-6xl mx-auto flex items-center justify-between p-4">

    <!-- Left: Back + Title -->
    <div class="flex items-center gap-4">

      <!-- Back Button -->
      <button
        class="w-5 h-5 md:w-9 md:h-9 flex items-center justify-center rounded-full bg-gray-100 hover:bg-gray-200 transition"
        (click)="goBack()">
        <ng-icon name="heroArrowLeft" class="w-5 h-5 text-gray-600"></ng-icon>
      </button>

      <!-- Page Title -->
      <h2 class="text-sm md:text-xl font-semibold text-gray-900 tracking-tight">
        {{ pageTitle }}
      </h2>

    </div>

    <!-- Right: Logo -->
    <div class="flex items-center">
      <app-logo></app-logo>
    </div>

  </div>
</div>
