<app-page-header [pageTitle]="categoryName() + ' Templates'"></app-page-header>

<div class="pt-16 sm:pt-20 md:pt-28 max-w-7xl mx-auto px-4">

  <!-- Title Section -->
  <div class="flex flex-col gap-2 mb-6">
    <h1 class="text-xl sm:text-2xl md:text-3xl font-semibold uppercase tracking-tight text-gray-900">
      {{ categoryName() }} Templates
    </h1>

    <p class="text-xs sm:text-sm md:text-base text-gray-600 max-w-2xl">
      Choose from professionally crafted templates for {{ categoryName() }}
    </p>
  </div>

  <!-- Templates Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-6">

    @for (template of templates; track $index) {
      <app-template-card
        [title]="template.title"
        [categoryName]="template.categoryName"
        [tone]="template.tone"
        [preview]="template.preview"
        [likes]="template.likes"
      />
    }

  </div>

</div>
