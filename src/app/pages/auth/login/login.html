<div class="max-w-lg mx-auto bg-white rounded-2xl p-10 shadow-lg flex flex-col items-center gap-6">

  <!-- Logo -->
   <div class="flex flex-col items-center gap-2 cursor-pointer"
  [routerLink]="['/']" routerLinkActive="router-link-active" 
  >
    <app-logo></app-logo>
  </div>

  <!-- Title -->
  <div class="text-center">
    <h1 class="font-extrabold text-2xl text-gray-900">Welcome back</h1>
    <p class="text-gray-500 text-sm mt-1">Sign in to your account to continue</p>
  </div>

  <!-- Form -->
  <div class="flex flex-col gap-5 w-full text-sm">

    <!-- Email -->
    <div class="flex flex-col gap-1">
      <label for="email" class="text-gray-700 font-medium">Email</label>
      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        class="p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none"
      />
    </div>

    <!-- Password -->
    <div class="flex flex-col gap-1">
      <div class="flex justify-between items-center">
        <label for="password" class="text-gray-700 font-medium">Password</label>
        <a href="/forgot-password" class="text-blue-600 text-sm">Forgot password?</a>
      </div>
      <div class="rounded-xl relative flex border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none">
              <input
        [type]="showPassword() ? 'text':'password'"
        id="password"
        placeholder="********"
        class="border-none outline-none p-3 w-full"
      />
      <button
      type="button"
      (click)="togglePassword()"
class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-500 hover:text-gray-700"
      >
    <ng-icon
    [name]="showPassword() ? 'heroEyeSlash':'heroEye'"
    style="width: 20px; height: 20px;"
    >

    </ng-icon>
    </button>
      </div>

    </div>

    <button
    (click)="onLogin()"
      class="w-full p-3 rounded-xl font-semibold text-white bg-blue-600 hover:bg-blue-700 transition">
      Sign In
    </button>
  </div>

  <!-- Divider -->
  <div class="flex items-center justify-center w-full gap-3 my-2">
    <div class="border-t border-gray-300 w-full"></div>
    <span class="text-xs text-gray-500 w-full text-center">Or continue with</span>
    <div class="border-t border-gray-300 w-full"></div>
  </div>

  <!-- Google Button -->
  <button
    class="w-full flex cursor-pointer items-center justify-center gap-3 border border-gray-300 rounded-xl p-3 hover:bg-blue-600 hover:text-white transition">
    <img src="/icons/google.png" class="w-5 h-5" />
    <span class="text-sm font-medium">Continue with Google</span>
  </button>

  <!-- Footer -->
  <p class="text-gray-600 text-sm">
    Don't have an account?
    <a routerLink="/register" class="text-blue-600 font-semibold cursor-pointer">
      Sign up
    </a>
  </p>

</div>
