<div class="max-w-md mx-auto bg-white rounded-2xl p-10 shadow-lg flex flex-col items-center gap-6">

  <!-- Logo -->
  <div class="flex flex-col items-center gap-2 cursor-pointer"
       [routerLink]="['/']">
    <app-logo></app-logo>
  </div>

  <!-- Header -->
  <div class="text-center">
    <h1 class="font-extrabold text-2xl text-gray-900">Forgot your password?</h1>
    <p class="text-gray-500 text-sm mt-2 max-w-sm">
      Don't worry! Enter your email and we’ll send you a password reset link.
    </p>
  </div>

  <!-- Form -->
  <div class="flex flex-col gap-5 w-full text-sm">

    <div class="flex flex-col gap-1">
      <label for="email" class="text-gray-700 font-medium">Email Address</label>
      <input
        type="email"
        id="email"
        placeholder="you@example.com"
        class="p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 focus:outline-none"
      />
    </div>

    <button
      class="w-full p-3 rounded-xl cursor-pointer font-semibold text-white bg-blue-600 hover:bg-blue-700 transition">
      Send Reset Link
    </button>
  </div>

  <!-- Back to Login -->
  <p class="text-gray-600 text-sm mt-3">
    Remember your password?
    <a routerLink="/login" class="text-blue-600 font-semibold cursor-pointer">
      Sign in
    </a>
  </p>

</div>
