
  @if (loading() ){
    <app-loader></app-loader>
  }
  @else
  {

  <app-navbar-auth></app-navbar-auth>

  <div class="pt-10 md:pt-24 w-full md:max-w-7xl mx-auto bg-gray-50">
      <h2 class="text-2xl md:text-4xl font-extrabold">Welcome back, {{currentUsername()}}</h2>
      <h4 class="text-sm md:text-lg md:font-medium mt-3 text-gray-600">Ready to create amazing emails?</h4>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-10 mt-20 w-full justify-between px-4">

    @for (stat of analytics; track $index) {
       <app-feature-card
        [count]="stat.value"
        [label]="stat.label"
        [icon]="stat.icon"
        [iconBg]="'linear-gradient(to bottom right, #6366f1, #3b82f6)'"

      />

    }

  </div>

  <!-- Quick Actions -->
   <app-quick-actions></app-quick-actions>

   <!-- Recent Emails -->
    <app-recent-emails></app-recent-emails>
  </div>

  }
