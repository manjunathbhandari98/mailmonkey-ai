<div class="w-full my-12 sm:my-20 px-2 sm:px-6 w-full mx-auto">

  <!-- Header -->
  <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center mb-6 gap-2">
    <h2 class="text-xl sm:text-2xl font-extrabold text-gray-900">Recent Emails</h2>

    <button class="text-blue-600 font-semibold hover:underline cursor-pointer text-sm sm:text-base self-start sm:self-auto">
      View All
    </button>
  </div>

  <!-- Emails List -->
  <div class="flex flex-col gap-4">

    @for (email of recentEmails; track $index) {

      <div class="bg-white border border-gray-200 p-4 sm:p-5 rounded-2xl shadow-sm hover:shadow-md transition cursor-pointer">

        <div class="flex flex-col sm:flex-row justify-between gap-4">

          <!-- Email Info -->
          <div class="flex flex-col gap-1 w-full">

            <div class="flex flex-wrap gap-2 items-center">
              <h2 class="text-base sm:text-lg font-semibold text-gray-900">
                {{ email.title }}
              </h2>

              <span class="px-2 py-1 text-[10px] sm:text-xs rounded-lg bg-blue-100 text-blue-600 font-medium">
                {{ email.tone }}
              </span>
            </div>

            <p class="text-gray-600 text-sm leading-relaxed line-clamp-2 sm:line-clamp-none">
              {{ email.preview }}
            </p>

            <p class="text-gray-400 text-xs mt-1 sm:mt-2">
              {{ email.time }}
            </p>

          </div>

          <!-- View Button -->
          <app-button
            label="View"
            customClass="px-4 py-2 text-sm w-full sm:w-auto"
            variant="ghost"
          />

        </div>

      </div>

    }

  </div>

</div>
