<div class="my-20 p-2 max-w-6xl mx-auto">
    <h1 class="text-5xl font-extrabold text-center">
        {{heading}}
    </h1>
    <h4 class="text-lg font-semibold text-center my-5 text-gray-500">{{subheading}}</h4>

 <div class="grid grid-cols-1 md:grid-cols-3 gap-10 mt-20 max-w-6xl w-full px-4">

  @for (feature of features; track $index) {

    <div
      class="group p-8 bg-white rounded-2xl shadow-sm border border-gray-100 
      hover:shadow-xl hover:border-transparent transition-all duration-300">

      <!-- Icon container -->
      <div
        class="w-14 h-14 rounded-xl bg-blue-600 flex items-center justify-center 
        shadow-md group-hover:scale-105 transition-transform duration-300">
        <ng-icon 
          [name]="feature.icon" 
            aria-setsize="20"
            style="color:white; width:20px; height: 20px;">
        </ng-icon>
      </div>

      <!-- Title -->
      <h2 class="text-lg font-bold text-gray-900 mt-5 tracking-tight">
        {{ feature.title }}
      </h2>

      <!-- Description -->
      <p class="text-sm text-gray-600 mt-2 leading-relaxed">
        {{ feature.description }}
      </p>

    </div>

  }

</div>

</div>
