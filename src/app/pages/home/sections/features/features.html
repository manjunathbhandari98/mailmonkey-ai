<div class="my-5 md:my-20 p-2 max-w-6xl mx-auto">
    <h1 class="text-xl md:text-5xl font-extrabold text-center">
        {{heading}}
    </h1>
    <h4 class="text-xs md:text-lg md:font-semibold text-center my-5 text-gray-500">{{subheading}}</h4>

 <div class="grid grid-cols-1 md:grid-cols-3 gap-10 mt-5 md:mt-20 max-w-6xl w-full px-4">

  @for (feature of features; track $index) {

     <app-feature-card
      [title]="feature.title"
      [description]="feature.description"
      [icon]="feature.icon"
      [iconBg]="'linear-gradient(to bottom right, #6366f1, #3b82f6)'"
      customClass="p-8"
    />

  }

</div>

</div>
