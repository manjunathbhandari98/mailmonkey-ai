<div class="w-6xl mx-auto p-5">
    <!-- Header -->
      <h1 class="text-4xl md:text-5xl font-extrabold text-center tracking-tight">
   Simple, Transparent Pricing
  </h1>
  <h4 class="text-lg text-center mt-3 text-gray-500 max-w-2xl mx-auto">
   Choose the plan that fits your needs
  </h4>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

  @for (plan of plans(); track $index) {

    <div class="bg-white my-10 relative p-6 rounded-2xl flex flex-col justify-between"
    [ngClass]="{
        'shadow-md hover:shadow-lg': !plan.highlight,
    'shadow-2xl scale-[1.03] border-blue-600':plan.highlight
    }"
    >

            @if (plan.highlight) {
          <div class="absolute -top-4 left-1/2 -translate-x-1/2">
            <span class="bg-blue-600 text-white text-xs font-bold px-4 py-1 rounded-full shadow">
              {{ plan.tag }}
            </span>
          </div>
        }

      <div class="header text-center mb-4">
        <h1 class="font-extrabold text-3xl">{{ plan.name }}</h1>

        <h2 class="font-extrabold text-5xl text-blue-600 mt-2">
          ${{ plan.price }}
          <span class="text-gray-500 font-medium text-[15px]">{{ plan.period }}</span>
        </h2>

      </div>

      <ul class="space-y-4 text-gray-900 text-sm mt-4">
        @for (feature of plan.features; track $index) {
          <li>
            <ng-icon 
          [name]="'heroCheck'" 
          style="width: 30px;"
            aria-setsize="20"
            >
        </ng-icon>
            {{ feature }}</li>
        }
      </ul>

      <button class="mt-6 font-semibold w-full py-2 border  rounded-xl hover:bg-purple-600 hover:text-white cursor-pointer transition"
      [ngClass] = "{
        'border-gray-300 text-black':!plan.highlight,
        'border-none bg-blue-600 text-white':plan.highlight
      }"
      >
        {{ plan.buttonText }}
      </button>

    </div>

  }

</div>

</div>
