<div class="max-w-6xl mx-auto px-4 sm:px-6 py-10">

  <!-- Header -->
  <h1 class="text-2xl sm:text-4xl md:text-5xl font-extrabold text-center tracking-tight">
    Simple, Transparent Pricing
  </h1>

  <h4 class="text-sm sm:text-base md:text-lg text-center mt-3 text-gray-500 max-w-2xl mx-auto">
    Choose the plan that fits your needs
  </h4>

  <!-- Pricing Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6 mt-10">

    @for (plan of plans(); track $index) {
      <app-pricing-card [plan]="plan" />
    }

  </div>

</div>
