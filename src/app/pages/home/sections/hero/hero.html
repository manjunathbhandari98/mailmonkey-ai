<div class="min-h-screen bg-gray-50 flex flex-col justify-center items-center px-4 sm:px-6 text-center py-10">

  <!-- Logo + Heading -->
  <div class="flex flex-col items-center gap-3 mb-8">
    <img src="/logo.png" alt="logo" class="w-16 h-16 sm:w-20 sm:h-20 drop-shadow" />

    <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">
      <span class="text-blue-600">Mail</span>Monkey AI
    </h1>

    <h2 class="text-xl sm:text-2xl font-bold mt-3 sm:mt-5 px-4">
      Write Perfect Emails <span class="text-blue-600">in Seconds with AI</span>
    </h2>

    <p class="text-gray-600 text-base sm:text-lg max-w-xl px-3">
      Generate perfect emails in just seconds. Smart. Fast. Professional.
    </p>
  </div>

  <!-- CTA Buttons -->
  <div class="mt-6 flex flex-col sm:flex-row gap-4 w-full sm:w-auto justify-center">

    <app-button
      label="Generate Email Now"
      iconType="ng-icon"
      iconPosition="right"
      iconValue="heroArrowRight"
      customClass="px-6 py-3 w-full sm:w-auto text-base"
      (clicked)="goToLogin()"
    />

    <app-button
      label="Try Demo"
      variant="outline"
      customClass="px-6 py-3 w-full sm:w-auto text-base"
      (clicked)="goToLogin()"
    />

  </div>

  <!-- Stats / Features -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 mt-14 max-w-6xl w-full px-3">

    @for (stat of stats; track $index) {

      <div
        class="p-6 bg-white rounded-2xl shadow border border-gray-100 
               hover:shadow-xl hover:border-gray-200 transition-all flex flex-col text-left"
      >
        <h1 class="text-3xl sm:text-4xl font-extrabold text-blue-600 drop-shadow-sm">
          {{ stat.value }}
        </h1>

        <h2 class="text-base sm:text-lg font-semibold text-gray-800 mt-2 tracking-tight">
          {{ stat.label }}
        </h2>

        <p class="text-sm text-gray-500 mt-1 max-w-xs">
          {{ stat.description }}
        </p>
      </div>

    }

  </div>

</div>
