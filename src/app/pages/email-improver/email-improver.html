<app-page-header [pageTitle]="'Improve Your Email'"></app-page-header>

<div class="pt-16 sm:pt-20 md:pt-28 max-w-7xl mx-auto px-4 grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8">

  <!-- LEFT SIDE -->
  <div class="bg-white border border-gray-200 shadow-sm rounded-2xl p-5 sm:p-8">
    <h1 class="text-xl sm:text-2xl font-extrabold text-gray-900 mb-4">Your Email</h1>

    <!-- TEXTAREA -->
    <textarea
      [ngModel]="originalEmail()"
      (ngModelChange)="originalEmail.set($event)"
      rows="10"
      class="w-full p-4 sm:p-5 text-sm leading-6 rounded-2xl border border-gray-300
             focus:ring-2 focus:ring-blue-500 outline-none bg-gray-50 resize-none"
      placeholder="Paste or write your email here..."
    ></textarea>

    <!-- VALIDATION -->
    @if(isInvalid()) {
      <p class="text-red-600 text-xs mt-2">{{ errorMessage() }}</p>
    }

    <!-- IMPROVEMENT OPTIONS -->
    <div class="mt-6">
      <h4 class="text-gray-800 font-semibold mb-3 text-sm sm:text-base">Choose Improvement Option</h4>

      <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mb-5">
        @for(option of improvementOptions; track option.id) {
          <app-button
            [label]="option.label"
            (clicked)="selectOption(option.id)"
            [variant]="selectedOption() === option.id ? 'primary' : 'outline'"
            customClass="p-2.5 sm:p-3 w-full rounded-xl font-medium text-xs sm:text-sm"
          />
        }
      </div>
    </div>

    <!-- IMPROVE BUTTON -->
    <app-button
      label="Improve Email"
      [loadingText]="'Generating...'"
      [loading]="isGenerating()"
      [disabled]="isInvalid() || isGenerating()"
      iconType="ng-icon"
      iconValue="heroSparkles"
      customClass="w-full py-3 sm:py-3 bg-blue-600 text-white hover:bg-blue-700 
                  disabled:bg-gray-400 disabled:cursor-not-allowed rounded-xl text-sm sm:text-base"
      (clicked)="improveEmail()"
    />
  </div>

  <!-- RIGHT SIDE -->
  <div class="bg-white border border-gray-200 shadow-sm rounded-2xl p-5 sm:p-8 text-sm">

    <!-- HEADER -->
    <div class="flex flex-col sm:flex-row justify-between sm:items-center gap-3">
      <div class="flex items-center gap-2">
        <h1 class="text-xl sm:text-2xl font-bold text-gray-900">Improved Email</h1>

        <span class="text-green-600 text-xs font-semibold px-2 py-1 rounded-full bg-green-100 flex items-center gap-1">
          <ng-icon name="heroCheckBadge" class="w-4 h-4"></ng-icon>
          Enhanced
        </span>
      </div>
    </div>

    <!-- VERSION SWITCHER -->
    <div class="flex overflow-x-auto gap-2 p-1 bg-gray-50 rounded-xl border border-gray-200 my-6">
      @for(index of [1,2,3]; track $index) {
        <button
          class="px-3 sm:px-4 py-2 rounded-xl font-medium text-xs sm:text-sm whitespace-nowrap transition"
          [ngClass]="
            currentVersion === index 
            ? 'bg-white shadow-sm text-blue-600' 
            : 'hover:bg-gray-100 text-gray-600'
          "
          (click)="setVersion(index)"
        >
          Version {{ index }}
        </button>
      }
    </div>

    <!-- SUBJECT -->
    <div class="flex flex-col gap-1 mb-4">
      <label class="font-medium text-gray-700">Subject</label>
      <input
        type="text"
        class="p-3 text-xs sm:text-sm rounded-xl border border-gray-300 outline-none font-semibold"
        [value]="generatedEmails[currentVersion]?.subject"
        readonly
      />
    </div>

    <!-- CONTENT -->
    <div class="flex flex-col gap-1">
      <label class="font-medium text-gray-700">Improved Email</label>
      <textarea
        rows="10"
        class="p-4 sm:p-5 text-sm leading-7 border border-gray-300 rounded-xl bg-white roboto-serif 
               focus:ring-2 focus:ring-blue-500 outline-none resize-none"
        [value]="generatedEmails[currentVersion]?.content"
        readonly
      ></textarea>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="flex flex-col sm:flex-row gap-3 mt-4 w-full">

      <app-button
        label="Copy Email"
        (clicked)="copyEmail()"
        iconType="img"
        iconValue="/icons/copy.png"
        customClass="w-full py-3"
        imageClass="!w-4 !h-4 filter invert brightness-0 saturate-100 hue-rotate-180"
      />

      <app-button
        label="Download"
        (clicked)="downloadPDF()"
        iconType="img"
        variant="outline"
        iconValue="/icons/download.png"
        customClass="w-full py-3 font-semibold hover:bg-gray-100"
        imageClass="!w-4 !h-4"
      />

    </div>

  </div>

</div>
