<!-- Page Header -->
<app-page-header [pageTitle]="'AI Email Generator'"></app-page-header>

<div class="pt-28 max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">

  <!-- LEFT: Email Context -->
  <div class="bg-white border border-gray-200 shadow-sm rounded-2xl p-8">

    <h1 class="text-2xl font-bold text-gray-900 mb-6">Email Context</h1>

    <form class="flex flex-col gap-6 text-sm">

      <!-- Receiver -->
      <div class="flex flex-col gap-1">
        <label class="font-medium text-gray-700">Receiver Name</label>
        <input
          type="text"
          name="receiver"
          [(ngModel)]="receiver"
          class="p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none"
          placeholder="Hiring Manager">
      </div>

      <!-- Sender -->
      <div class="flex flex-col gap-1">
        <label class="font-medium text-gray-700">Sender Name</label>
        <input
          type="text"
          name="sender"
          [(ngModel)]="sender"
          class="p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none"
          placeholder="John Doe">
      </div>

      <!-- Email Type -->
      <div class="flex flex-col gap-1">
        <label class="font-medium text-gray-700">Email Type</label>
        <select
        name="emailType"
          [(ngModel)]="emailType"
          class="p-3 rounded-xl border border-gray-300 bg-white focus:ring-2 focus:ring-blue-500 outline-none">
          <option value="jobApplication">Job Application</option>
          <option value="follow-up">Follow-Up</option>
          <option value="proposal">Proposal</option>
          <option value="apology">Apology</option>
          <option value="networking">Networking</option>
          <option value="custom">Custom</option>
        </select>
      </div>

      <!-- Tone -->
      <div class="flex flex-col gap-1">
        <label class="font-medium text-gray-700">Tone</label>
        <select
        name="tone"
          [(ngModel)]="tone"
          class="p-3 rounded-xl border border-gray-300 bg-white focus:ring-2 focus:ring-blue-500 outline-none">

          <optgroup label="Professional">
            <option value="professional">Professional</option>
            <option value="formal">Formal</option>
            <option value="concise">Concise</option>
          </optgroup>

          <optgroup label="Friendly">
            <option value="friendly">Friendly</option>
            <option value="polite">Polite</option>
            <option value="casual">Casual</option>
          </optgroup>

          <optgroup label="Creative">
            <option value="enthusiastic">Enthusiastic</option>
            <option value="storytelling">Storytelling</option>
          </optgroup>

        </select>
      </div>

      <!-- Subject -->
      <div class="flex flex-col gap-1">
        <label class="font-medium text-gray-700">Subject</label>
        <input
          type="text"
          name="subject"
          [(ngModel)]="subject"
          class="p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none"
          placeholder="Application for Senior Developer Position">
      </div>

      <!-- Key Points -->
      <div class="flex flex-col gap-1">
        <label class="font-medium text-gray-700">Key Points</label>
        <textarea
        name="keypoints"
          rows="5"
          [(ngModel)]="keypoints"
          class="p-3 rounded-xl border border-gray-300 focus:ring-2 focus:ring-blue-500 outline-none"
          placeholder="• 5 years experience&#10;• Strong backend skills&#10;• Interested in the role">
        </textarea>
      </div>

      <!-- Buttons -->
      <div class="flex gap-3">
        <button
          class="w-2/3 p-3 flex items-center justify-center gap-2 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700 transition"
          (click)="generateEmail()">
          <ng-icon name="heroSparkles" class="w-5 h-5"></ng-icon>
          Generate Email
        </button>

        <button
          type="button"
          class="w-1/3 p-3 border border-gray-300 rounded-xl hover:bg-gray-100 transition"
          (click)="clearForm()">
          Clear
        </button>
      </div>

    </form>
  </div>

  <!-- RIGHT: Generated Email -->
  <div class="bg-white border border-gray-200 shadow-sm rounded-2xl p-8 text-sm">

    <!-- Header with actions -->
    <div class="flex justify-between items-center">
      <h1 class="text-2xl font-bold text-gray-900">Generated Email</h1>

      <div class="flex items-center gap-5 text-gray-600">
        <!-- <ng-icon name="heroClipboard" 
        style="width: 20px; height: 20px;"
        class=" cursor-pointer hover:text-blue-600"></ng-icon>
        <ng-icon
        style="width: 20px; height: 20px;"
        name="heroArrowDown" class="w-5 h-5 cursor-pointer hover:text-blue-600"></ng-icon>
        <ng-icon
        style="width: 20px; height: 20px;"
        name="heroBookmark" class="w-5 h-5 cursor-pointer hover:text-blue-600"></ng-icon>
        <ng-icon
        style="width: 20px; height: 20px;"
        name="heroArrowPath" class="w-5 h-5 cursor-pointer hover:text-blue-600" (click)="regenerate()"></ng-icon> -->
        <img src="/icons/copy.png" alt="copy" class="w-4 h-4 cursor-pointer">
        <img src="/icons/download.png" alt="download" class="w-4 h-4 cursor-pointer">
        <img src="/icons/generative.png" alt="regenerate" class="w-4 h-4 cursor-pointer">
        <img src="/icons/save.png" alt="save" class="w-4 h-4 cursor-pointer">
      
      </div>
    </div>

    <!-- Version Selector -->
    <div class="flex gap-2 p-1 bg-gray-50 rounded-xl border border-gray-200 my-5">
      @for(index of [1,2,3]; track $index) {
        <button
          class="px-4 py-2 rounded-xl font-medium transition"
          [ngClass]="currentVersion === index ? 'bg-white shadow-sm text-blue-600' : 'hover:bg-white/60'"
          (click)="setVersion(index)">
          Version {{ index }}
        </button>
      }
    </div>

    <!-- Subject -->
    <div class="flex flex-col gap-1 mb-4">
      <label class="font-medium text-sm text-gray-700">Subject Line</label>
      <input
        type="text"
        class="p-3 text-sm rounded-xl border border-gray-300 outline-none font-semibold"
        [value]="generatedEmails[currentVersion]?.subject">
    </div>

    <!-- Email content — uses Roboto Serif -->
    <div class="flex flex-col gap-1">
      <label class="font-medium text-sm text-gray-700">Email Content</label>
      <textarea
        rows="18"
        class="p-4 text-[14px] leading-7 border border-gray-300 rounded-xl bg-white roboto-serif focus:ring-2 focus:ring-blue-500 outline-none"
        [value]="generatedEmails[currentVersion]?.content">
      </textarea>
    </div>

         <div class="flex gap-3 mt-3">
        <button
          class="w-2/3 p-3 flex items-center justify-center gap-2 rounded-xl bg-blue-600 text-white font-semibold hover:bg-blue-700 transition"
          (click)="generateEmail()">
           <img src="/icons/copy.png" alt="copy" class="w-4 h-4 filter invert brightness-0 saturate-100 hue-rotate-180 cursor-pointer">
          Copy Email
        </button>

          <button
          class="w-1/3 p-3 flex items-center justify-center gap-2 rounded-xl hover:bg-blue-600 hover:text-white font-semibold hover:bg-blue-700 transition"
          (click)="generateEmail()">
           <img src="/icons/download.png" alt="download" class="w-4 h-4 cursor-pointer">
          Download PDF
        </button>
      </div>

  </div>

</div>
