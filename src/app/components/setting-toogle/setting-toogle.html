<div class="flex items-center justify-between shadow-md bg-white p-4 rounded-xl my-4">

    <!-- Title and desc -->
     <div class="flex flex-col gap-1">

         <h4 class="font-semibold text-gray-900">{{title}}</h4>
         <div class="text-gray-500 text-sm">{{description}}</div>
     </div>

     <!-- Toggle -->
      <button 
      (click) ="toggle()"
      class="relative inline-flex h-6 w-11 items-center rounded-full"
      [class.bg-blue-600]="value"
      [class.bg-gray-300]="!value"
      >
        <span class="inline-block h-5 w-5 transform rounded-full bg-white transition"
        [class.translate-x-5]="value"
        [class.translate-x-1]="!value"
        >
        </span>
    </button>
</div>
