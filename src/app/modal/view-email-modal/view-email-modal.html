<div 
  class="fixed inset-0 bg-black/40 backdrop-blur-sm flex items-center justify-center z-[999]"
  (click)="close()"
>
  <!-- Modal Box -->
  <div 
    class="bg-white w-full max-w-3xl rounded-2xl shadow-2xl p-6 animate-fadeIn scale-100"
    (click)="$event.stopPropagation()"
  >

    <!-- Header -->
    <div class="flex justify-between items-start border-b pb-4">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">{{ email.subject }}</h1>

        <div class="flex items-center gap-3 mt-1 text-sm text-gray-500">
          <span>{{ email.type }}</span>
          <span class="text-gray-400">•</span>
          <span>{{ email.tone }}</span>
          <span class="text-gray-400">•</span>
          <span>{{ email.createdAt | date:'medium' }}</span>
        </div>
      </div>

      <app-button 
      label="x"
      (clicked)="close()"
      customClass="p-2 !w-6 !h-6 !text-lg !rounded-full !text-center"
      variant="secondary"
      />
    </div>

    <!-- Action Toolbar -->
    <div class="flex items-center justify-between mt-4 border-b pb-3">

      <div class="flex items-center gap-5 text-gray-600">
        <ng-icon 
          name="heroDocumentDuplicate"
          class="w-5 h-5 cursor-pointer hover:text-blue-600"
          (click)="copyEmail()"
        ></ng-icon>

        <ng-icon 
          name="heroArrowDownTray"
          class="w-5 h-5 cursor-pointer hover:text-blue-600"
          (click)="downloadEmail()"
        ></ng-icon>

        <ng-icon 
          name="heroBookmark"
          class="w-5 h-5 cursor-pointer hover:text-blue-600"
          (click)="saveEmail()"
        ></ng-icon>

        <ng-icon 
          name="heroArrowPath"
          class="w-5 h-5 cursor-pointer hover:text-blue-600"
          (click)="regenerate()"
        ></ng-icon>
      </div>

      <app-button 
      label="Use This"
      (clicked)="useTemplate()"
      customClass="px-4 py-2"
      />
    </div>

    <!-- Email Content -->
    <div class="mt-6 max-h-[60vh] overflow-y-auto pr-2">

      <!-- Subject -->
      <p class="text-sm text-gray-700 mb-2 font-semibold">
        Subject: <span class="font-normal">{{ email.subject }}</span>
      </p>

      <div class="border border-gray-200 rounded-xl p-4 bg-white">
        <pre class="whitespace-pre-wrap font-[Roboto_Serif] text-[15px] leading-7 text-gray-800">
{{ email.content }}
        </pre>
      </div>
    </div>

  </div>
</div>
